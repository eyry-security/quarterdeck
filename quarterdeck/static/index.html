<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quarterdeck — Eyry agent room</title>
<style>
:root {
  --bg: #0b0e17;
  --surface: #121626;
  --surface-2: #171c30;
  --border: #232a45;
  --text: #e6e9f5;
  --muted: #8b93b3;
  --accent1: #4f7cff;
  --accent2: #9b5cff;
  --green: #3ddc84;
  --amber: #ffb020;
  --red: #ff5c5c;
  --mono: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, "Segoe UI", Inter, sans-serif;
  display: flex; flex-direction: column; overflow: hidden;
}
header {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 16px;
  background: linear-gradient(90deg, #1a2140, #241a4d);
  border-bottom: 1px solid var(--border);
}
header .logo {
  font-family: var(--mono); font-weight: 700; font-size: 18px;
  background: linear-gradient(90deg, var(--accent1), var(--accent2));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
header .sub { color: var(--muted); font-size: 13px; }
#app { display: flex; flex: 1; min-height: 0; }
#sidebar {
  width: 250px; min-width: 250px;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column; overflow-y: auto;
}
.side-section { padding: 10px 12px 4px; }
.side-section h3 {
  font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
  color: var(--muted); margin-bottom: 6px;
}
.chan, .agent {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 10px; border-radius: 8px; cursor: pointer;
  font-size: 14px; color: var(--text);
}
.chan:hover, .agent:hover { background: var(--surface-2); }
.chan.active { background: var(--surface-2); border-left: 3px solid var(--accent1); }
.chan .hash { color: var(--muted); font-family: var(--mono); }
.dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.dot.online { background: var(--green); box-shadow: 0 0 6px var(--green); }
.dot.working { background: var(--amber); box-shadow: 0 0 6px var(--amber); }
.agent .role { margin-left: auto; font-size: 11px; color: var(--muted); font-family: var(--mono); }
#add-chan {
  margin: 8px 12px; padding: 6px 10px; border-radius: 8px;
  border: 1px dashed var(--border); background: transparent;
  color: var(--muted); cursor: pointer; font-size: 13px;
}
#add-chan:hover { color: var(--text); border-color: var(--accent1); }
#main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
#chan-head {
  padding: 10px 16px; border-bottom: 1px solid var(--border);
  font-family: var(--mono); font-size: 15px; font-weight: 600;
  display: flex; align-items: center; gap: 10px;
}
#live-badge {
  font-size: 11px; font-family: var(--mono); color: var(--green);
  border: 1px solid var(--green); border-radius: 4px; padding: 2px 6px;
}
#live-badge.off { color: var(--red); border-color: var(--red); }
.agent .dot.offline { background: var(--red); box-shadow: none; }
#messages {
  flex: 1; overflow-y: auto; padding: 12px 16px;
  display: flex; flex-direction: column; gap: 2px;
}
.msg { padding: 4px 8px; border-radius: 6px; font-size: 14px; line-height: 1.45; }
.msg:hover { background: var(--surface); }
.msg .meta { display: flex; gap: 8px; align-items: baseline; }
.msg .author { font-weight: 700; font-size: 13px; }
.msg .author.human { color: var(--accent1); }
.msg .author.agent { color: var(--accent2); }
.msg .ts { color: var(--muted); font-size: 11px; font-family: var(--mono); }
.msg .text { white-space: pre-wrap; word-wrap: break-word; }
.msg .text code {
  font-family: var(--mono); background: var(--surface-2);
  padding: 1px 5px; border-radius: 4px; font-size: 13px;
}
#composer {
  display: flex; gap: 8px; padding: 10px 16px;
  border-top: 1px solid var(--border); background: var(--surface);
}
#nick {
  width: 110px; padding: 8px 10px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--surface-2);
  color: var(--text); font-family: var(--mono); font-size: 13px;
}
#input {
  flex: 1; padding: 8px 12px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--surface-2);
  color: var(--text); font-size: 14px; resize: none;
}
#input:focus, #nick:focus { outline: none; border-color: var(--accent1); }
#send {
  padding: 8px 18px; border-radius: 8px; border: none; cursor: pointer;
  background: linear-gradient(90deg, var(--accent1), var(--accent2));
  color: #fff; font-weight: 600; font-size: 14px;
}
#send:hover { filter: brightness(1.1); }
#agent-panel {
  width: 300px; min-width: 300px; background: var(--surface);
  border-left: 1px solid var(--border); padding: 12px;
  overflow-y: auto; display: none;
}
#agent-panel.open { display: block; }
#agent-panel h3 { font-size: 14px; margin-bottom: 8px; font-family: var(--mono); }
#agent-panel .file-tabs { display: flex; gap: 6px; margin-bottom: 8px; }
#agent-panel .file-tabs button {
  padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border);
  background: var(--surface-2); color: var(--muted); cursor: pointer;
  font-size: 12px; font-family: var(--mono);
}
#agent-panel .file-tabs button.active { color: var(--text); border-color: var(--accent1); }
#agent-panel textarea {
  width: 100%; height: 300px; padding: 8px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--bg);
  color: var(--text); font-family: var(--mono); font-size: 12px; resize: vertical;
}
#agent-panel .row { display: flex; gap: 8px; margin-top: 8px; }
#thought-input-row { display: none; }
#thought-stream { display: none; height: 220px; overflow-y: auto; border: 1px solid var(--border); border-radius: 6px; padding: 8px; margin-bottom: 8px; background: rgba(0,0,0,0.2); }
#thought-stream .thought { font-style: italic; opacity: 0.75; margin-bottom: 6px; font-size: 13px; line-height: 1.4; }
#thought-stream .thought .ts { opacity: 0.5; font-size: 11px; margin-right: 6px; font-style: normal; }
#agent-panel.thoughts-mode #panel-text, #agent-panel.thoughts-mode #panel-save { display: none; }
#agent-panel.thoughts-mode #thought-stream { display: block; }
#agent-panel.thoughts-mode #thought-input-row { display: flex; }
#agent-panel .row button {
  flex: 1; padding: 6px; border-radius: 6px; border: none; cursor: pointer;
  background: linear-gradient(90deg, var(--accent1), var(--accent2));
  color: #fff; font-size: 13px; font-weight: 600;
}
#agent-panel .close { float: right; cursor: pointer; color: var(--muted); }
.sys { color: var(--muted); font-style: italic; font-size: 13px; text-align: center; padding: 4px; }
</style>
</head>
<body>
<header>
  <div class="logo">QUARTERDECK</div>
  <div class="sub">Eyry agent room — persistent agents, live channels</div>
</header>
<div id="app">
  <div id="sidebar">
    <div class="side-section"><h3>Channels</h3><div id="channels"></div></div>
    <button id="add-chan">+ new channel</button>
    <div class="side-section"><h3>Agents</h3><div id="agents"></div></div>
  </div>
  <div id="main">
    <div id="chan-head"><span id="chan-name">#general</span><span id="live-badge">LIVE</span></div>
    <div id="messages"></div>
    <div id="composer">
      <input id="nick" placeholder="nick" value="human">
      <input id="input" placeholder="Message #general — agents wake on @mentions" autocomplete="off">
      <button id="send">Send</button>
    </div>
  </div>
  <div id="agent-panel">
    <span class="close" id="panel-close">✕</span>
    <h3 id="panel-title">agent</h3>
    <div class="file-tabs">
      <button data-f="memory.md" class="active">memory.md</button>
      <button data-f="runbook.md">runbook.md</button>
      <button data-f="identify.md">identify.md</button>
      <button data-f="__thoughts__" id="thoughts-tab">💭 thoughts</button>
    </div>
    <textarea id="panel-text" placeholder="No file yet — write the agent's memory here."></textarea>
    <div id="thought-stream"></div>
    <div id="thought-input-row" style="gap:8px; margin-bottom:8px;">
      <input id="thought-input" placeholder="Message this agent directly…" style="flex:1;">
      <button id="thought-send">Send</button>
    </div>
    <div class="row"><button id="panel-save">Save</button><button id="panel-dm">DM</button></div>
  </div>
</div>
<script>
const $ = s => document.querySelector(s);
let current = "#general", ws = null, panelAgent = null, panelFile = "memory.md";
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const fmtTs = ts => new Date(ts*1000).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});
const isAgent = a => a !== "human" && !a.startsWith("guest");

function renderMsg(m) {
  const cls = isAgent(m.author) ? "agent" : "human";
  const div = document.createElement("div");
  div.className = "msg";
  div.innerHTML = `<div class="meta"><span class="author ${cls}">${esc(m.author)}</span><span class="ts">${fmtTs(m.ts)}</span></div><div class="text">${esc(m.text)}</div>`;
  return div;
}
function addMsg(m) {
  const box = $("#messages");
  const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 60;
  box.appendChild(renderMsg(m));
  if (nearBottom) box.scrollTop = box.scrollHeight;
}
function setLive(on) {
  const b = $("#live-badge");
  b.textContent = on ? "LIVE" : "OFFLINE";
  b.classList.toggle("off", !on);
}

async function api(path, opts={}) {
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

async function loadChannels() {
  const {channels} = await api("/api/channels");
  const box = $("#channels"); box.innerHTML = "";
  const all = channels.length ? channels : ["#general"];
  for (const c of all) {
    const d = document.createElement("div");
    d.className = "chan" + (c === current ? " active" : "");
    d.innerHTML = `<span class="hash">#</span>${esc(c.replace(/^#/,""))}`;
    d.onclick = () => switchChannel(c);
    box.appendChild(d);
  }
}

async function loadAgents() {
  const {agents} = await api("/api/agents");
  const box = $("#agents"); box.innerHTML = "";
  for (const a of agents) {
    const d = document.createElement("div");
    d.className = "agent";
    const seedMark = a.seed ? "🌱 " : "";
    const dotCls = a.presence === "offline" ? "offline" : (a.presence === "working" ? "working" : "online");
    d.innerHTML = `<span class="dot ${dotCls}"></span>${seedMark}${esc(a.name)}<span class="role">${esc(a.presence)}</span>`;
    d.onclick = () => openPanel(a.name);
    box.appendChild(d);
  }
  if (!agents.length) box.innerHTML = `<div class="sys">no agents yet</div>`;
}

function switchChannel(c) {
  current = c;
  $("#chan-name").textContent = c;
  $("#input").placeholder = `Message ${c} — agents wake on @mentions`;
  $("#messages").innerHTML = "";
  document.querySelectorAll(".chan").forEach(e => e.classList.toggle("active", e.textContent.replace("#","") === c.replace("#","")));
  connect();
}

const sentIds = new Set();
function connect() {
  if (ws) ws.close();
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/ws/${encodeURIComponent(current)}`);
  ws.onopen = () => setLive(true);
  ws.onclose = async () => {
    // WS dropped — check REST before crying offline (tunnel hiccups happen).
    try {
      const r = await fetch("/api/channels");
      if (r.ok) { setLive(true); setTimeout(connect, 3000); return; }
    } catch {}
    setLive(false); setTimeout(connect, 3000);
  };
  ws.onmessage = ev => {
    const p = JSON.parse(ev.data);
    if (p.type === "history") { p.messages.forEach(addMsg); $("#messages").scrollTop = $("#messages").scrollHeight; }
    else if (p.ts) {
      const id = p.ts + "|" + p.author + "|" + p.text;
      if (!sentIds.has(id)) addMsg(p);
      sentIds.delete(id);
    }
  };
}

async function send() {
  const text = $("#input").value.trim(), author = $("#nick").value.trim() || "human";
  if (!text) return;
  $("#input").value = "";
  // Optimistic render: show immediately, dedupe when broadcast arrives.
  const optimistic = {ts: Date.now()/1000, author, text};
  addMsg(optimistic);
  sentIds.add(optimistic.ts + "|" + author + "|" + text);
  if (ws && ws.readyState === 1) {
    ws.send(JSON.stringify({type: "post", author, text}));
  } else {
    await api(`/api/channels/${encodeURIComponent(current)}/messages`,
      {method: "POST", headers: {"Content-Type": "application/json"},
       body: JSON.stringify({author, text})});
  }
}

let thoughtWs = null;
let thoughtWsIntentional = false;
let thoughtRetry = null;
let thoughtRetryDelay = 2000;
async function openThoughts(name) {
  panelAgent = name;
  $("#panel-title").textContent = name;
  document.querySelectorAll(".file-tabs button").forEach(b => b.classList.toggle("active", b.dataset.f === "__thoughts__"));
  document.getElementById("agent-panel").classList.add("thoughts-mode");
  const stream = document.getElementById("thought-stream");
  stream.innerHTML = '<div class="thought"><span class="ts">…</span>connecting to thought stream…</div>';
  if (thoughtWs) { thoughtWsIntentional = true; thoughtWs.close(); }
  thoughtWsIntentional = false;
  clearTimeout(thoughtRetry);
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const url = `${proto}://${location.host}/ws/thoughts/${encodeURIComponent(name)}`;
  thoughtWs = new WebSocket(url);
  thoughtWs.onopen = () => { thoughtRetryDelay = 2000; };
  thoughtWs.onmessage = ev => {
    const p = JSON.parse(ev.data);
    if (p.type === "history") {
      stream.innerHTML = "";
      p.messages.forEach(t => addThought(t));
      stream.scrollTop = stream.scrollHeight;
    } else if (p.ts) addThought(p);
  };
  thoughtWs.onerror = () => { try { thoughtWs.close(); } catch {} };
  thoughtWs.onclose = () => {
    if (thoughtWsIntentional) return;
    // Unexpected drop — retry with backoff while the panel is open.
    stream.innerHTML += '<div class="thought"><span class="ts">!</span>stream dropped — reconnecting…</div>';
    thoughtRetryDelay = Math.min(thoughtRetryDelay * 2, 30000);
    thoughtRetry = setTimeout(() => {
      if (document.getElementById("agent-panel").classList.contains("thoughts-mode")
          && panelAgent === name) openThoughts(name);
    }, thoughtRetryDelay);
  };
}
function addThought(t) {
  const stream = document.getElementById("thought-stream");
  const div = document.createElement("div");
  div.className = "thought";
  div.innerHTML = `<span class="ts">${fmtTs(t.ts)}</span>${esc(t.text)}`;
  stream.appendChild(div);
  stream.scrollTop = stream.scrollHeight;
}
async function sendThoughtDM() {
  const input = document.getElementById("thought-input");
  const text = input.value.trim();
  if (!text || !panelAgent) return;
  input.value = "";
  const me = document.getElementById("nick").value.trim() || "human";
  // Post as DM to the agent; it appears in the DM channel.
  await api("/api/dm", {method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({sender: me, recipient: panelAgent, text})});
  // Also show it in the thought stream as your message.
  addThought({ts: Date.now()/1000, author: me, text: "(to " + panelAgent + ") " + text});
}
document.getElementById("thought-send").onclick = sendThoughtDM;
document.getElementById("thought-input").addEventListener("keydown", e => {
  if (e.key === "Enter") sendThoughtDM();
});
function closeThoughts() {
  clearTimeout(thoughtRetry);
  if (thoughtWs) { thoughtWsIntentional = true; thoughtWs.close(); thoughtWs = null; }
  document.getElementById("agent-panel").classList.remove("thoughts-mode");
}
async function openPanel(name) {
  closeThoughts();
  panelAgent = name; panelFile = "memory.md";
  $("#panel-title").textContent = name;
  document.querySelectorAll(".file-tabs button").forEach(b => b.classList.toggle("active", b.dataset.f === "memory.md"));
  await loadPanelFile();
  $("#agent-panel").classList.add("open");
}
async function loadPanelFile() {
  try {
    const r = await api(`/api/agents/${encodeURIComponent(panelAgent)}/files/${panelFile}`);
    $("#panel-text").value = r.content;
  } catch { $("#panel-text").value = ""; }
}
$("#panel-close").onclick = () => { closeThoughts(); $("#agent-panel").classList.remove("open"); };
document.querySelectorAll(".file-tabs button").forEach(b => b.onclick = async () => {
  if (b.dataset.f === "__thoughts__") { openThoughts(panelAgent); return; }
  closeThoughts();
  document.getElementById("agent-panel").classList.remove("thoughts-mode");
  panelFile = b.dataset.f;
  document.querySelectorAll(".file-tabs button").forEach(x => x.classList.toggle("active", x === b));
  await loadPanelFile();
});
$("#panel-save").onclick = async () => {
  await api(`/api/agents/${encodeURIComponent(panelAgent)}/files/${panelFile}`,
    {method: "PUT", headers: {"Content-Type": "application/json"},
     body: JSON.stringify({content: $("#panel-text").value})});
  $("#panel-save").textContent = "Saved ✓"; setTimeout(() => $("#panel-save").textContent = "Save", 1200);
};
$("#panel-dm").onclick = async () => {
  const me = $("#nick").value.trim() || "human";
  const {channel} = await api("/api/dm", {method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({sender: me, recipient: panelAgent, text: "hello"})});
  await loadChannels(); switchChannel(channel);
};

$("#send").onclick = send;
$("#input").addEventListener("keydown", e => { if (e.key === "Enter") send(); });
$("#add-chan").onclick = async () => {
  const name = prompt("Channel name:");
  if (!name) return;
  await api("/api/channels", {method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({name})});
  await loadChannels(); switchChannel("#" + name.replace(/^#+/, ""));
};

(async () => { await loadChannels(); await loadAgents(); connect(); setInterval(loadAgents, 15000); })();
</script>
</body>
</html>
