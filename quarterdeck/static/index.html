<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quarterdeck — Eyry agent room</title>
<style>
:root {
  --bg: #0b0e17;
  --surface: #121626;
  --surface-2: #171c30;
  --border: #232a45;
  --text: #e6e9f5;
  --muted: #8b93b3;
  --accent1: #4f7cff;
  --accent2: #9b5cff;
  --green: #3ddc84;
  --amber: #ffb020;
  --red: #ff5c5c;
  --mono: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, "Segoe UI", Inter, sans-serif;
  display: flex; flex-direction: column; overflow: hidden;
}
header {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 16px;
  background: linear-gradient(90deg, #1a2140, #241a4d);
  border-bottom: 1px solid var(--border);
}
header .logo {
  font-family: var(--mono); font-weight: 700; font-size: 18px;
  background: linear-gradient(90deg, var(--accent1), var(--accent2));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
header .sub { color: var(--muted); font-size: 13px; }
#sidebar-toggle {
  display: none; align-items: center; justify-content: center;
  width: 44px; height: 44px; flex: 0 0 auto;
  border: 1px solid var(--border); border-radius: 8px;
  background: var(--surface-2); color: var(--text);
  font-size: 20px; line-height: 1; cursor: pointer;
}
#sidebar-toggle:hover { border-color: var(--accent1); }
#sidebar-scrim { display: none; }
#usage-widget { margin-left: auto; font-family: var(--mono); font-size: 12px;
  color: var(--dim); border: 1px solid var(--line); border-radius: 8px;
  padding: 4px 10px; cursor: pointer; white-space: nowrap; }
#usage-widget:hover { border-color: var(--accent1); color: var(--text); }
#usage-widget .warn { color: #ffb86b; }
#usage-widget .crit { color: #ff6b6b; }
#usage-panel { position: absolute; top: 52px; right: 12px; z-index: 50;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  padding: 12px 14px; min-width: 280px; font-size: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.5); }
#usage-panel h4 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase;
  letter-spacing: .06em; color: var(--dim); }
#usage-panel .urow { display: flex; justify-content: space-between; padding: 2px 0;
  font-family: var(--mono); }
#usage-panel .bar { height: 6px; background: var(--line); border-radius: 3px; margin: 8px 0; overflow: hidden; }
#usage-panel .bar > div { height: 100%; background: linear-gradient(90deg, var(--accent1), var(--accent2)); }
#usage-panel input { width: 90px; background: var(--surface-2); color: var(--text);
  border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; font-family: var(--mono); font-size: 12px; }
#usage-panel button { background: transparent; color: var(--dim); border: 1px solid var(--line);
  border-radius: 6px; padding: 3px 10px; cursor: pointer; font-size: 12px; }
#usage-panel button:hover { border-color: var(--accent1); color: var(--text); }
#app { display: flex; flex: 1; min-height: 0; }
#sidebar {
  width: 250px; min-width: 250px;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column; overflow-y: auto;
}
.side-section { padding: 10px 12px 4px; }
.side-section h3 {
  font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
  color: var(--muted); margin-bottom: 6px;
}
.chan, .agent {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 10px; border-radius: 8px; cursor: pointer;
  font-size: 14px; color: var(--text);
}
.chan:hover, .agent:hover { background: var(--surface-2); }
.chan.active { background: var(--surface-2); border-left: 3px solid var(--accent1); }
.agent.active { background: var(--surface-2); border-left: 3px solid var(--accent2); }
.chan .hash { color: var(--muted); font-family: var(--mono); }
.dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.dot.online { background: var(--green); box-shadow: 0 0 6px var(--green); }
.dot.thinking { background: transparent; border: 2px solid var(--accent1); border-top-color: transparent;
  animation: spin 0.8s linear infinite; box-shadow: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.dot.working { background: var(--amber); box-shadow: 0 0 6px var(--amber); }
.agent .dot.offline { background: var(--red); box-shadow: none; }
.agent .role { margin-left: auto; font-size: 11px; color: var(--muted); font-family: var(--mono); }
#add-chan {
  margin: 8px 12px; padding: 6px 10px; border-radius: 8px;
  border: 1px dashed var(--border); background: transparent;
  color: var(--muted); cursor: pointer; font-size: 13px;
}
#add-chan:hover { color: var(--text); border-color: var(--accent1); }
#main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
#chan-head {
  padding: 10px 16px; border-bottom: 1px solid var(--border);
  font-family: var(--mono); font-size: 15px; font-weight: 600;
  display: flex; align-items: center; gap: 10px;
}
#model-picker {
  background: var(--panel); color: var(--dim); border: 1px solid var(--line);
  border-radius: 6px; font-size: 11px; padding: 2px 6px; margin-left: 8px;
  font-family: var(--mono); cursor: pointer;
}
#model-picker:focus { outline: none; border-color: var(--accent1); }
#deregister-btn { background: transparent; color: var(--dim); border: 1px solid var(--line);
  border-radius: 6px; font-size: 11px; padding: 2px 8px; margin-left: 8px;
  font-family: var(--mono); cursor: pointer; }
#deregister-btn:hover { color: #ff6b6b; border-color: #ff6b6b; }
#resetenv-btn { background: transparent; color: var(--dim); border: 1px solid var(--line);
  font-size: 11px; padding: 2px 8px; border-radius: 4px; cursor: pointer; margin-left: 6px; }
#resetenv-btn:hover { color: var(--accent2); border-color: var(--accent2); }
#chan-subs { padding: 6px 16px; border-bottom: 1px solid var(--line); font-size: 11px;
  color: var(--dim); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
#chan-subs .subs-label { font-family: var(--mono); text-transform: uppercase; letter-spacing: .05em; }
.msg.mention { background: rgba(88, 101, 242, 0.12); border-left: 3px solid var(--accent1); padding-left: 9px; }
.unread-badge { background: var(--accent1); color: #fff; border-radius: 10px; font-size: 10px;
  padding: 1px 7px; margin-left: 6px; font-family: var(--mono); font-weight: 700; }
#subs-panel { padding: 6px 12px; border-bottom: 1px solid var(--line); font-size: 11px;
  color: var(--dim); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
#subs-panel .subs-label { font-family: var(--mono); text-transform: uppercase; letter-spacing: .05em; }
.sub-toggle { display: inline-flex; align-items: center; gap: 4px; cursor: pointer;
  border: 1px solid var(--line); border-radius: 12px; padding: 2px 8px; font-family: var(--mono); }
.sub-toggle.on { border-color: var(--accent1); color: var(--text); }
.sub-toggle.off { opacity: .55; }
#view-tag {
  font-size: 11px; font-family: var(--mono); font-weight: 400;
  color: var(--muted); border: 1px solid var(--border);
  border-radius: 4px; padding: 2px 6px;
}
#live-badge {
  font-size: 11px; font-family: var(--mono); color: var(--green);
  border: 1px solid var(--green); border-radius: 4px; padding: 2px 6px;
}
#live-badge.off { color: var(--red); border-color: var(--red); }
#messages {
  flex: 1; overflow-y: auto; padding: 12px 16px;
  display: flex; flex-direction: column; gap: 2px;
}
.msg { padding: 4px 8px; border-radius: 6px; font-size: 14px; line-height: 1.45; }
.msg:hover { background: var(--surface); }
.msg .meta { display: flex; gap: 8px; align-items: baseline; }
.msg .author { font-weight: 700; font-size: 13px; }
.msg .author.human { color: var(--accent1); }
.msg .author.agent { color: var(--accent2); }
.msg .ts { color: var(--muted); font-size: 11px; font-family: var(--mono); }
.msg .text { white-space: pre-wrap; word-wrap: break-word; }
.msg .text code {
  font-family: var(--mono); background: var(--surface-2);
  padding: 1px 5px; border-radius: 4px; font-size: 13px;
}
/* Thinking: faint internal monologue. Posts: solid external messages. */
.msg.thought {
  font-style: italic;
  opacity: 0.68;
  border-left: 2px solid rgba(155, 92, 255, 0.45);
  padding-left: 10px;
  margin-left: 2px;
}
.msg.thought:hover { background: var(--surface); opacity: 0.92; }
.msg.thought .ts { font-style: normal; }
/* Thoughts collapse by default: preview line + expand toggle. */
.msg.thought .t-full { display: none; }
.msg.thought.expanded .t-full { display: block; }
.msg.thought .t-sep { border-top: 1px dashed rgba(167, 139, 250, 0.26); margin: 6px 0; }
.msg.thought.expanded .t-preview { display: none; }
.msg.thought .t-toggle {
  background: none; border: none; cursor: pointer;
  color: var(--accent2); font-size: 11px; font-style: normal;
  padding: 2px 6px; margin-left: 6px; border-radius: 4px;
  font-family: var(--mono); white-space: nowrap;
}
.msg.thought .t-toggle:hover { background: rgba(167, 139, 250, 0.18); }
.msg.thought .t-text { cursor: pointer; }
/* Tool calls in the thought stream: monospace, amber accent. */
.msg.thought .t-seg.toolcall {
  font-family: var(--mono);
  font-style: normal;
  font-size: 12px;
  background: rgba(251, 191, 36, 0.08);
  border-left: 2px solid rgba(251, 191, 36, 0.5);
  padding: 4px 8px;
  margin: 4px 0;
  border-radius: 0 4px 4px 0;
  word-break: break-word;
}
.msg.thought .t-seg.toolresult {
  font-family: var(--mono);
  font-style: normal;
  font-size: 12px;
  opacity: 0.85;
  padding: 2px 8px 2px 18px;
  word-break: break-word;
}
#composer {
  display: flex; gap: 8px; padding: 10px 16px;
  border-top: 1px solid var(--border); background: var(--surface);
}
#input {
  flex: 1; padding: 8px 12px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--surface-2);
  color: var(--text); font-size: 14px; resize: none;
}
#input:focus { outline: none; border-color: var(--accent1); }
#send {
  padding: 8px 18px; border-radius: 8px; border: none; cursor: pointer;
  background: linear-gradient(90deg, var(--accent1), var(--accent2));
  color: #fff; font-weight: 600; font-size: 14px;
}
#send:hover { filter: brightness(1.1); }
.sys { color: var(--muted); font-style: italic; font-size: 13px; text-align: center; padding: 4px; }
/* Mobile: sidebar becomes an off-canvas drawer, main conversation stays full-width. */
@media (max-width: 900px) {
  html, body { height: 100dvh; }
  body { overflow: hidden; }
  header {
    gap: 8px; padding: 8px 10px;
    padding-top: calc(8px + env(safe-area-inset-top));
  }
  header .logo {
    flex: 0 1 auto; min-width: 0; font-size: 16px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  header .sub { display: none; }
  #sidebar-toggle { display: inline-flex; }
  #usage-widget {
    flex: 1 1 auto; min-width: 0; max-width: none; min-height: 44px;
    display: flex; align-items: center; justify-content: flex-end;
    padding: 4px 8px; overflow: hidden;
  }
  #usage-summary {
    display: block; min-width: 0; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }
  #usage-panel {
    position: fixed; top: calc(env(safe-area-inset-top) + 60px);
    left: 10px; right: 10px; min-width: 0;
    max-height: calc(100dvh - 80px); overflow-y: auto;
  }
  #usage-panel input { width: 120px; min-height: 44px; font-size: 16px; }
  #usage-panel button { min-width: 44px; min-height: 44px; }
  #app { position: relative; overflow: hidden; }
  #sidebar {
    position: absolute; top: 0; bottom: 0; left: 0; z-index: 60;
    width: min(84vw, 320px); min-width: 0;
    box-shadow: 8px 0 24px rgba(0,0,0,.5);
    transform: translateX(-100%); transition: transform .2s ease;
    -webkit-overflow-scrolling: touch;
  }
  body.sidebar-open #sidebar { transform: translateX(0); }
  #sidebar-scrim {
    display: block; position: absolute; inset: 0; z-index: 55;
    background: rgba(0,0,0,.5); opacity: 0; pointer-events: none;
    transition: opacity .2s ease;
  }
  body.sidebar-open #sidebar-scrim { opacity: 1; pointer-events: auto; }
  .side-section { padding: 10px 12px 4px; }
  .chan, .agent { min-height: 44px; padding: 10px 12px; font-size: 15px; }
  #add-chan { min-height: 44px; font-size: 14px; }
  #main { width: 100%; min-width: 0; }
  #chan-head {
    padding: 8px 12px; gap: 8px; flex-wrap: wrap;
    font-size: 14px; min-width: 0;
  }
  #chan-name { min-width: 0; overflow-wrap: anywhere; }
  #model-picker, #deregister-btn, #resetenv-btn {
    min-height: 44px; padding: 6px 10px; font-size: 12px;
  }
  #live-badge { margin-left: auto; display: inline-flex; align-items: center; min-height: 32px; }
  #chan-subs, #subs-panel { padding: 8px 12px; }
  .sub-toggle { min-height: 44px; padding: 6px 12px; }
  #messages { padding: 10px 12px; }
  .msg { font-size: 15px; padding: 6px 8px; }
  .msg .text { overflow-wrap: anywhere; word-break: break-word; }
  .msg .text code { overflow-wrap: anywhere; }
  .msg.thought .t-toggle {
    display: inline-flex; align-items: center;
    min-height: 44px; padding: 8px 10px;
  }
  #composer {
    gap: 6px; flex-wrap: nowrap;
    padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
  }
  #input {
    flex: 1 1 auto; min-width: 0; min-height: 44px;
    padding: 10px 12px; font-size: 16px; line-height: 1.3;
  }
  #send {
    flex: 0 0 auto; min-width: 44px; min-height: 44px;
    padding: 8px 14px; font-size: 15px;
  }
}

/* ============================================================
   Liquid Glass — Eyry design system (mirrors eyry_pro/static/glass.css)
   ============================================================ */
:root {
  color-scheme: dark;
  --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", Inter, "Segoe UI", sans-serif;
  --font-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --mono: var(--font-mono);
  --bg: #05070d;
  --bg-1: #080d18;
  --surface: rgba(13, 18, 30, 0.62);
  --surface-2: rgba(255, 255, 255, 0.09);
  --panel: rgba(10, 16, 28, 0.86);
  --border: rgba(255, 255, 255, 0.13);
  --line: rgba(255, 255, 255, 0.075);
  --text: #f4f7ff;
  --fg: #f4f7ff;
  --fg-soft: #c9d2e6;
  --muted: #a7b2ca;
  --dim: #a7b2ca;
  --dim-2: #8592ad;
  --accent1: #3b82f6;
  --accent2: #8b5cf6;
  --acc-blue: #3b82f6;
  --acc-purple: #8b5cf6;
  --green: #4ade80;
  --amber: #fbbf24;
  --red: #ff6b7a;
  --glass-bg: rgba(255, 255, 255, 0.085);
  --glass-bg-soft: rgba(255, 255, 255, 0.055);
  --glass-bg-strong: rgba(255, 255, 255, 0.13);
  --glass-border: rgba(255, 255, 255, 0.13);
  --glass-edge: rgba(255, 255, 255, 0.25);
  --blur: 22px;
  --radius-xl: 32px;
  --radius-lg: 24px;
  --radius-md: 18px;
  --radius-sm: 14px;
  --radius-pill: 999px;
  --shadow-sm: 0 8px 24px rgba(0, 0, 0, 0.24);
  --shadow-md: 0 18px 48px rgba(0, 0, 0, 0.38);
  --shadow-lg: 0 30px 80px rgba(0, 0, 0, 0.55);
  --glow-blue: rgba(59, 130, 246, 0.34);
  --glow-purple: rgba(139, 92, 246, 0.32);
  --spring: cubic-bezier(0.32, 0.72, 0, 1);
  --ease: cubic-bezier(0.4, 0, 0.2, 1);
}
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 15px;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
body::before {
  content: "";
  position: fixed;
  inset: -30vmax;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(38vmax 38vmax at 12% 8%, var(--glow-blue), transparent 68%),
    radial-gradient(44vmax 44vmax at 88% 18%, var(--glow-purple), transparent 70%),
    radial-gradient(42vmax 42vmax at 58% 92%, rgba(37, 99, 235, 0.18), transparent 72%);
  filter: blur(18px);
  animation: ambientDrift 34s var(--ease) infinite alternate;
}
body::after {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(100% 80% at 50% 0%, rgba(255, 255, 255, 0.05), transparent 60%),
    linear-gradient(180deg, rgba(5, 7, 13, 0) 0%, rgba(5, 7, 13, 0.52) 100%);
}
@keyframes ambientDrift {
  from { transform: translate3d(-1.5%, -1%, 0) scale(1); }
  to { transform: translate3d(2%, 1.5%, 0) scale(1.06); }
}
@keyframes cardRise {
  from { opacity: 0; transform: translateY(10px) scale(0.992); }
  to { opacity: 1; transform: none; }
}

header, #app { position: relative; z-index: 1; }
::selection { background: rgba(139, 92, 246, 0.45); color: #fff; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.14);
  border: 2px solid transparent;
  border-radius: 999px;
  background-clip: padding-box;
}
::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.24); background-clip: padding-box; }

/* ---- floating glass top bar ---- */
header {
  position: sticky;
  top: 10px;
  z-index: 40;
  min-height: 62px;
  margin: 10px 12px 12px;
  padding: 10px 16px;
  border: 1px solid var(--glass-border);
  border-radius: 22px;
  background: linear-gradient(155deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0.055));
  box-shadow: inset 0 1px 0 var(--glass-edge), var(--shadow-md);
  -webkit-backdrop-filter: blur(var(--blur)) saturate(160%);
  backdrop-filter: blur(var(--blur)) saturate(160%);
}
header .logo {
  font-family: var(--font-sans);
  font-size: 18px;
  font-weight: 760;
  letter-spacing: -0.045em;
  background: linear-gradient(105deg, #8ec5ff, #a78bfa 58%, #d8b4fe);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
header .sub { color: var(--dim); font-size: 12.5px; }
#sidebar-toggle {
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-pill);
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.045));
  box-shadow: inset 0 1px 0 var(--glass-edge), var(--shadow-sm);
  -webkit-backdrop-filter: blur(14px) saturate(150%);
  backdrop-filter: blur(14px) saturate(150%);
}
#sidebar-toggle:hover { border-color: rgba(255, 255, 255, 0.28); }
#usage-widget {
  color: var(--fg-soft);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-pill);
  background: rgba(3, 7, 15, 0.32);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12);
  -webkit-backdrop-filter: blur(14px) saturate(150%);
  backdrop-filter: blur(14px) saturate(150%);
  font-family: var(--font-mono);
}
#usage-widget:hover { border-color: rgba(255, 255, 255, 0.28); color: var(--fg); }
#usage-panel {
  top: 66px;
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-md);
  background: linear-gradient(155deg, rgba(18, 24, 40, 0.95), rgba(10, 15, 26, 0.9));
  box-shadow: inset 0 1px 0 var(--glass-edge), var(--shadow-lg);
  -webkit-backdrop-filter: blur(var(--blur)) saturate(160%);
  backdrop-filter: blur(var(--blur)) saturate(160%);
  color: var(--fg-soft);
}
#usage-panel h4 { color: var(--dim); }
#usage-panel .bar { background: rgba(255, 255, 255, 0.09); }
#usage-panel input {
  background: rgba(3, 7, 15, 0.5);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-pill);
  color: var(--fg);
  min-height: 36px;
}
#usage-panel button {
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-pill);
  background: rgba(255, 255, 255, 0.06);
  color: var(--fg-soft);
}
#usage-panel button:hover { border-color: rgba(255, 255, 255, 0.3); color: var(--fg); }

/* ---- app shell ---- */
#app { gap: 12px; min-height: 0; padding: 0 12px 12px; }
#sidebar {
  width: 248px;
  min-width: 248px;
  margin: 0;
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-lg);
  background: linear-gradient(155deg, rgba(255, 255, 255, 0.11), rgba(255, 255, 255, 0.035));
  box-shadow: inset 0 1px 0 var(--glass-edge), var(--shadow-md);
  -webkit-backdrop-filter: blur(var(--blur)) saturate(160%);
  backdrop-filter: blur(var(--blur)) saturate(160%);
}
.side-section h3 {
  color: var(--dim-2);
  font-family: var(--font-mono);
  font-size: 9.5px;
  letter-spacing: 0.14em;
}
.chan, .agent {
  border: 1px solid transparent;
  border-radius: 14px;
  color: var(--fg-soft);
  font-weight: 600;

<body>

  <button id="sidebar-toggle" type="button" aria-label="Toggle agents and channels" aria-controls="sidebar" aria-expanded="false">☰</button>
  <div class="logo">QUARTERDECK</div>
  <div class="sub">Eyry agent room — persistent agents, live channels</div>
  <div id="usage-widget" title="Token usage — click for breakdown">
    <span id="usage-summary">…</span>
  </div>
  <div id="usage-panel" style="display:none"></div>
</header>
<div id="app">
  <div id="sidebar">
    <div class="side-section"><h3>Agents</h3><div id="agents"></div></div>
    <div class="side-section"><h3>Channels</h3><div id="channels"></div></div>
    <button id="add-chan">+ new channel</button>
  </div>
  <div id="sidebar-scrim" aria-hidden="true"></div>
  <div id="main">
    <div id="chan-head"><span id="chan-name">#general</span><span id="view-tag" style="display:none">thoughts</span><select id="model-picker" style="display:none" title="Agent model"></select><button id="deregister-btn" style="display:none" title="Deregister this agent">deregister</button><button id="resetenv-btn" style="display:none" title="Reset environment: wipe /work, rebuild from clean image">reset env</button><span id="live-badge">LIVE</span></div>
    <div id="chan-subs" style="display:none"></div>
    <div id="subs-panel" style="display:none"><span class="subs-label">subscribed:</span><span id="subs-list"></span></div>
    <div id="messages"></div>
    <div id="composer">
      <span id="nick" class="identity-chip" title="Your identity in Quarterdeck">operator</span>
      <input id="input" placeholder="Message #general — agents wake on @mentions" autocomplete="off">
      <button id="send" aria-label="Send message">Send</button>
    </div>
  </div>
</div>
<script>
const $ = s => document.querySelector(s);
// View: {type:"channel", name:"#general"} or {type:"thoughts", agent:"scout"}
let view = {type: "channel", name: "#general"};
let viewSeq = 0;
let ws = null, dmWs = null;
const renderedIds = new Set();
// Unread tracking: channel -> timestamp of last view. Persisted.
const unreadKey = "qd-unread";
let lastRead = {};
try { lastRead = JSON.parse(localStorage.getItem(unreadKey) || "{}"); } catch {}
const saveLastRead = () => { try { localStorage.setItem(unreadKey, JSON.stringify(lastRead)); } catch {} };
let unreadCounts = {};  // channel -> count
// cid -> {id, el}: optimistic messages awaiting their authoritative echo.
const pendingCid = new Map();
const newCid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
  : "c" + Date.now().toString(36) + Math.random().toString(36).slice(2);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const fmtTs = ts => new Date(ts*1000).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});
const fmtTime = ts => new Date(ts*1000).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
const fmtDivider = ts => {
  const d = new Date(ts*1000), now = new Date();
  const yest = new Date(now); yest.setDate(now.getDate() - 1);
  let day;
  if (d.toDateString() === now.toDateString()) day = "Today";
  else if (d.toDateString() === yest.toDateString()) day = "Yesterday";
  else day = d.toLocaleDateString([], {month:'short', day:'numeric'});
  return `${day} \u00b7 ${fmtTime(ts)}`;
};
const isAgent = a => a !== "human" && a !== "operator" && !String(a).startsWith("guest");
const isSystemMsg = m => {
  const a = String((m && m.author) || "");
  const t = String((m && m.text) || "");
  if (a === "system" || a === "") return true;
  return /^(?:joined|left|parted)\b/i.test(t) ||
    /(?:\bjoined|\bleft|\bparted)\b (?:the )?(?:channel|room|chat)\b/i.test(t) ||
    /^\u2014 .+ (?:joined|left|parted)\b/i.test(t);
};
const nick = () => "operator";
const msgId = m => m.id || (m.ts + "|" + m.author + "|" + m.text);
// Deterministic DM channel, mirrors server dm_channel(): sorted pair.
const dmChannelFor = agent => {
  const pair = [nick().trim(), agent.trim()].sort();
  return `#dm-${pair[0]}-${pair[1]}`;
};
const thoughtChannelFor = agent => `#thoughts-${agent}`;

// Compact thought preview: first line, truncated. Returns {preview, expandable}.
function thoughtPreview(t) {
  const full = String(t == null ? "" : t);
  const first = full.split("\n")[0];
  const cut = first.length > 90 ? first.slice(0, 90) + "\u2026" : first;
  return { full, preview: cut || "\u2026", expandable: full !== cut };
}

// Toggle expand/collapse on a thought block (single thought or chain).
function toggleThoughtBlock(div) {
  const open = div.classList.toggle("expanded");
  div.classList.toggle("collapsed", !open);
  const b = div.querySelector(".t-toggle");
  if (b) b.textContent = open ? "\u25be show less" : "\u25b8 show more";
}

// Full HTML for a chain of thoughts: segments joined by subtle dividers.
function chainFullHtml(msgs) {
  return msgs.map((m, i) => {
    const t = String(m.text == null ? "" : m.text);
    let cls = "t-seg";
    if (t.startsWith("\U0001F527")) cls += " toolcall";       // 🔧 tool call
    else if (t.startsWith("\u2192")) cls += " toolresult";    // → tool result
    return (i ? '<div class="t-sep"></div>' : "") +
      `<div class="${cls}">${esc(t)}</div>`;
  }).join("");
}

// A chain of consecutive thoughts from the same agent, rendered as one
// collapsible block. Preview shows the first line of the first thought.
function renderThoughtChain(msgs) {
  const first = msgs[0];
  const cls = isAgent(first.author) ? "agent" : "human";
  const div = document.createElement("div");
  div.className = "msg thought chain collapsed";
  div._chain = msgs.slice();
  div._chainAuthor = first.author;
  div.dataset.author = first.author;
  div.dataset.kind = "thought";
  div.dataset.ts = first.ts;
  const tp = thoughtPreview(first.text);
  const expandable = msgs.length > 1 || tp.expandable;
  div.innerHTML = `<div class="meta"><span class="author ${cls}">${esc(first.author)}</span>` +
    `<span class="ts">${fmtTs(first.ts)}</span></div>` +
    `<div class="text t-text"><span class="t-preview">${esc(tp.preview)}</span>` +
    `<div class="t-full">${chainFullHtml(msgs)}</div>` +
    (expandable ? '<button class="t-toggle" title="expand/collapse">\u25b8 show more</button>' : "") +
    "</div>";
  div.querySelector(".t-text").addEventListener("click", () => toggleThoughtBlock(div));
  return div;
}

// Append a thought to an existing chain block (live websocket path).
// Returns the block element.
function appendToThoughtChain(div, m) {
  div._chain.push(m);
  div.querySelector(".t-full").innerHTML = chainFullHtml(div._chain);
  if (!div.querySelector(".t-toggle")) {
    const b = document.createElement("button");
    b.className = "t-toggle";
    b.title = "expand/collapse";
    b.textContent = div.classList.contains("expanded") ? "\u25be show less" : "\u25b8 show more";
    div.querySelector(".t-text").appendChild(b);
  }
  return div;
}


// kind: "msg" (normal), "dm" (DM, strip "(dm) " prefix), "thought" (internal monologue styling)
function renderMsg(m, kind) {
  kind = kind || "msg";
  const system = kind !== "thought" && isSystemMsg(m);
  const cls = isAgent(m.author) ? "agent" : "human";
  const div = document.createElement("div");
  div.dataset.author = m.author;
  div.dataset.kind = kind;
  div.dataset.ts = m.ts;
  if (system) {
    div.className = "msg system";
    div.innerHTML = `<span class="sys-text">${esc(m.text)}</span>`;
    return div;
  }
  const own = kind !== "thought" && !isAgent(m.author) && String(m.author) === nick();
  div.className = "msg" + (own ? " own" : "") + (kind === "thought" ? " thought" : "");
  // IRC-style @mention highlight for the current user
  try {
    const me = nick().toLowerCase();
    const txt = String(m.text || "");
    if (me && new RegExp("@" + me.replace(/[.*+?^${}()|[\\]\\\\]/g, "\\$&") + "\\b", "i").test(txt)) {
      div.classList.add("mention");
    }
  } catch {}
  let text = m.text;
  if (kind === "dm" && typeof text === "string" && text.startsWith("(dm) ")) text = text.slice(5);
  if (kind === "thought") {
    // Consecutive thoughts chain into one collapsible block.
    const el = renderThoughtChain([m]);
    if (div.classList.contains("mention")) el.classList.add("mention");
    return el;
  }
  const initial = (String(m.author || "?").trim().charAt(0) || "?").toUpperCase();
  div.innerHTML = `<div class="meta"><span class="avatar ${cls}" aria-hidden="true">${esc(initial)}</span>` +
    `<span class="author ${cls}">${esc(m.author)}</span></div>` +
    `<div class="text">${esc(text)}</div>` +
    `<span class="msg-time">${esc(fmtTime(m.ts))}</span>`;
  return div;
}
function prevMessage(box) {
  for (let n = box.lastElementChild; n; n = n.previousElementSibling) {
    if (n.classList.contains("msg")) return n;
  }
  return null;
}
function addTimeDivider(box, ts) {
  const d = document.createElement("div");
  d.className = "time-divider";
  d.textContent = fmtDivider(ts);
  box.appendChild(d);
}
function addMsg(m, kind) {
  kind = kind || "msg";
  const id = msgId(m);
  if (renderedIds.has(id)) return null;
  renderedIds.add(id);
  const box = $("#messages");
  const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 60;
  let el;
  if (kind === "thought") {
    // Chain consecutive thoughts from the same agent into one block.
    const last = box.lastElementChild;
    if (last && last.classList.contains("thought") && last.classList.contains("chain") &&
        last._chainAuthor === m.author) {
      el = appendToThoughtChain(last, m);
    } else {
      el = renderThoughtChain([m]);
      box.appendChild(el);
    }
  } else {
    const prev = prevMessage(box);
    const prevTs = prev ? Number(prev.dataset.ts) : null;
    const gap = prevTs ? Math.abs(Number(m.ts) - prevTs) : Infinity;
    const sameDay = prevTs ? new Date(prevTs*1000).toDateString() === new Date(Number(m.ts)*1000).toDateString() : false;
    const lastIsDivider = box.lastElementChild && box.lastElementChild.classList.contains("time-divider");
    const showDivider = !prev || gap > 5*60 || !sameDay;
    if (showDivider && !lastIsDivider) addTimeDivider(box, m.ts);
    el = renderMsg(m, kind);
    if (!el.classList.contains("system")) {
      const sameGroup = !!prev && !prev.classList.contains("system") &&
        prev.dataset.kind === kind && prev.dataset.author === m.author &&
        gap <= 5*60 && sameDay;
      if (sameGroup) {
        el.classList.add("cont");
        const oldTime = prev.querySelector(".msg-time");
        if (oldTime) oldTime.remove();
        prev.classList.remove("group-last");
      } else {
        el.classList.add("group-start");
      }
      el.classList.add("group-last");
    }
    box.appendChild(el);
  }
  if (nearBottom) box.scrollTop = box.scrollHeight;
  return el;
}
// Remove an optimistic message (e.g. its send failed).
function dropOptimistic(cid) {
  const pend = pendingCid.get(cid);
  if (!pend) return;
  pendingCid.delete(cid);
  renderedIds.delete(pend.id);
  if (pend.el) pend.el.remove();
}
function setLive(on) {
  const b = $("#live-badge");
  b.textContent = on ? "LIVE" : "OFFLINE";
  b.classList.toggle("off", !on);
}

function setSidebar(open) {
  document.body.classList.toggle("sidebar-open", open);
  $("#sidebar-toggle").setAttribute("aria-expanded", open ? "true" : "false");
}

async function api(path, opts={}) {
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

function refreshActive() {
  document.querySelectorAll(".chan").forEach(e => {
    const name = "#" + e.textContent.replace("#", "").trim();
    e.classList.toggle("active", view.type === "channel" && name === view.name);
  });
  document.querySelectorAll(".agent").forEach(e => {
    e.classList.toggle("active", view.type === "thoughts" && e.dataset.name === view.agent);
  });
}

function updateUnreadBadges() {
  // Channel sidebar badges
  for (const d of document.querySelectorAll("#channels .chan")) {
    const name = "#" + d.textContent.replace("#", "").trim().split("\n")[0];
    // extract channel name from the element
    const c = d._chan;
    if (!c) continue;
    let badge = d.querySelector(".unread-badge");
    const n = unreadCounts[c] || 0;
    if (n > 0) {
      if (!badge) { badge = document.createElement("span"); badge.className = "unread-badge"; d.appendChild(badge); }
      badge.textContent = n;
    } else if (badge) badge.remove();
  }
  // Agent rows: unread in their thought or DM channel
  for (const d of document.querySelectorAll("#agents .agent-row")) {
    const agent = d._agent;
    if (!agent) continue;
    const n = (unreadCounts[thoughtChannelFor(agent)] || 0) + (unreadCounts[dmChannelFor(agent)] || 0);
    let badge = d.querySelector(".unread-badge");
    if (n > 0) {
      if (!badge) { badge = document.createElement("span"); badge.className = "unread-badge"; d.appendChild(badge); }
      badge.textContent = n;
    } else if (badge) badge.remove();
  }
}

function clearUnreadForView() {
  if (view.type === "channel") {
    delete unreadCounts[view.name];
  } else if (view.type === "thoughts") {
    delete unreadCounts[thoughtChannelFor(view.agent)];
    delete unreadCounts[dmChannelFor(view.agent)];
  }
  lastRead[view.type === "channel" ? view.name : view.agent] = Date.now()/1000;
  saveLastRead();
  updateUnreadBadges();
}

async function loadChannels() {
  const {channels} = await api("/api/channels");
  const box = $("#channels"); box.innerHTML = "";
  // Thought streams live under AGENTS and DMs live in the agent view;
  // keep the channel list to real channels only.
  const list = (channels || []).filter(c => !c.startsWith("#thoughts-") && !c.startsWith("#dm-"));
  const all = list.length ? list : ["#general"];
  for (const c of all) {
    const d = document.createElement("div");
    d.className = "chan" + (view.type === "channel" && c === view.name ? " active" : "");
    d._chan = c;
    d.innerHTML = `<span class="hash">#</span>${esc(c.replace(/^#/,""))}`;
    d.onclick = () => switchChannel(c);
    box.appendChild(d);
  }
  updateUnreadBadges();
}

async function loadAgents() {
  const {agents} = await api("/api/agents");
  const box = $("#agents"); box.innerHTML = "";
  for (const a of agents) {
    const d = document.createElement("div");
    d.className = "agent" + (view.type === "thoughts" && view.agent === a.name ? " active" : "");
    d.dataset.name = a.name;
    const seedMark = a.seed ? "🌱 " : "";
    const dotCls = a.thinking ? "thinking" : (a.presence === "offline" ? "offline" : (a.presence === "working" ? "working" : "online"));
    const modelShort = (a.model || "").replace(/^[^:]+:/, "").replace(/^claude-/, "") || "default";
    d._agent = a.name;
    d.innerHTML = `<span class="dot ${dotCls}"></span>${seedMark}${esc(a.name)}<span class="role">${esc(a.presence)} · ${esc(modelShort)}</span>`;
    d.onclick = () => openThoughts(a.name);
    box.appendChild(d);
  }
  if (!agents.length) box.innerHTML = `<div class="sys">no agents yet</div>`;
  updateUnreadBadges();
}

function closeSockets() {
  viewSeq++;
  for (const s of [ws, dmWs]) { try { s && s.close(); } catch {} }
  ws = dmWs = null;
  pendingCid.clear(); renderedIds.clear();
}

function switchChannel(c) {
  closeSockets();
  setSidebar(false);
  view = {type: "channel", name: c};
  clearUnreadForView();
  loadChanSubs(c);
  $("#chan-name").textContent = c;
  $("#view-tag").style.display = "none";
  $("#model-picker").style.display = "none";
  $("#subs-panel").style.display = "none";
  $("#deregister-btn").style.display = "none";
  $("#resetenv-btn").style.display = "none";
  $("#input").placeholder = `Message ${c} — agents wake on @mentions`;
  $("#messages").innerHTML = "";
  refreshActive();
  connectChannel();
}

async function openThoughts(agent) {
  closeSockets();
  setSidebar(false);
  $("#chan-subs").style.display = "none";
  const seq = viewSeq;
  view = {type: "thoughts", agent};
  $("#chan-name").textContent = agent;
  const vt = $("#view-tag"); vt.style.display = ""; vt.textContent = "thoughts";
  $("#input").placeholder = `Message ${agent} directly…`;
  await loadModelPicker(agent);
  await loadSubs(agent);
  const dg = $("#deregister-btn");
  dg.style.display = "";
  const rb = $("#resetenv-btn");
  rb.style.display = "";
  rb.onclick = async () => {
    if (!confirm(`Reset ${agent}'s environment? /work will be wiped and the container rebuilt from the clean image.`)) return;
    rb.textContent = "resetting…";
    try {
      const r = await api(`/api/agents/${encodeURIComponent(agent)}/reset-env`, {method: "POST"});
      alert("Environment reset: " + (r.result || "done"));
    } catch (e) { alert("Reset failed: " + e.message); }
    rb.textContent = "reset env";
  };
  dg.onclick = async () => {
    if (!confirm(`Deregister ${agent}? Their loop stops, files are archived (not deleted).`)) return;
    try {
      await api(`/api/agents/${encodeURIComponent(agent)}`, {method: "DELETE"});
      switchChannel("#general");
      loadAgents();
    } catch (e) { alert("Deregister failed: " + e.message); }
  };
  $("#messages").innerHTML = "";
  refreshActive();
  // Merged history: internal monologue + DM conversation, chronological.
  const tCh = thoughtChannelFor(agent), dCh = dmChannelFor(agent);
  let thoughts = [], dms = [];
  try { thoughts = (await api(`/api/channels/${encodeURIComponent(tCh)}/messages?limit=50`)).messages || []; } catch {}
  try { dms = (await api(`/api/channels/${encodeURIComponent(dCh)}/messages?limit=50`)).messages || []; } catch {}
  if (seq !== viewSeq) return;
  [...thoughts.map(m => [m, "thought"]), ...dms.map(m => [m, "dm"])]
    .sort((a, b) => a[0].ts - b[0].ts)
    .forEach(([m, kind]) => addMsg(m, kind));
  $("#messages").scrollTop = $("#messages").scrollHeight;
  clearUnreadForView();
  connectThoughts(tCh, dCh, seq);
}

const wsProto = () => location.protocol === "https:" ? "wss" : "ws";

function channelSocket(channel, kind, seq, onLive) {
  const s = new WebSocket(`${wsProto()}://${location.host}/ws/${encodeURIComponent(channel)}`);
  s.onopen = () => setLive(true);
  s.onclose = async () => {
    if (seq !== viewSeq) return;
    // WS dropped — check REST before crying offline (tunnel hiccups happen).
    try {
      const r = await fetch("/api/channels");
      setLive(r.ok);
    } catch { setLive(false); }
    setTimeout(() => { if (seq === viewSeq) onLive(); }, 3000);
  };
  s.onmessage = ev => {
    if (seq !== viewSeq) { console.debug("[ws] stale msg dropped", channel, "seq", seq, "viewSeq", viewSeq); return; }
    const p = JSON.parse(ev.data);
    console.debug("[ws] recv", channel, p.type || "msg", (p.text||"").slice(0,40));
    // Unread: message for a channel we're not viewing
    if (!p.type && p.ts) {
      const viewing = (view.type === "channel" && view.name === channel) ||
        (view.type === "thoughts" && (thoughtChannelFor(view.agent) === channel || dmChannelFor(view.agent) === channel));
      if (!viewing) {
        unreadCounts[channel] = (unreadCounts[channel] || 0) + 1;
        updateUnreadBadges();
      } else {
        lastRead[channel] = Date.now()/1000; saveLastRead();
      }
    }
    if (p.type === "history") { p.messages.forEach(m => addMsg(m, kind)); $("#messages").scrollTop = $("#messages").scrollHeight; }
    else if (p.ts) {
      if (p.cid && pendingCid.has(p.cid)) {
        // Authoritative echo of our optimistic message: swap it in so
        // exactly one copy renders, with the server's timestamp.
        const pend = pendingCid.get(p.cid);
        pendingCid.delete(p.cid);
        renderedIds.delete(pend.id);
        if (pend.el) pend.el.remove();
      }
      addMsg(p, kind);
    }
  };
  return s;
}

function connectChannel() {
  const seq = viewSeq;
  const name = view.name;
  const kind = name.startsWith("#dm-") ? "dm" : "msg";
  ws = channelSocket(name, kind, seq, () => {
    if (view.type === "channel" && view.name === name) connectChannel();
  });
}

function connectThoughts(tCh, dCh, seq) {
  const agent = view.agent;
  ws = channelSocket(tCh, "thought", seq, () => {
    if (view.type === "thoughts" && view.agent === agent) connectThoughts(tCh, dCh, viewSeq);
  });
  dmWs = channelSocket(dCh, "dm", seq, () => {
    if (view.type === "thoughts" && view.agent === agent) connectThoughts(tCh, dCh, viewSeq);
  });
}

async function send() {
  const text = $("#input").value.trim(), author = nick();
  if (!text) return;
  $("#input").value = "";
  const cid = newCid();
  const track = (msg, kind) => {
    const el = addMsg(msg, kind);
    if (el) pendingCid.set(cid, {id: msgId(msg), el});
  };
  if (view.type === "thoughts") {
    // DM the agent directly; it lands in the deterministic DM channel.
    const agent = view.agent;
    track({ts: Date.now()/1000, author, text, cid}, "dm");
    try {
      await api("/api/dm", {method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({sender: author, recipient: agent, text, cid})});
    } catch (e) { dropOptimistic(cid); throw e; }
    loadChannels(); // surface the DM channel in the sidebar
  } else {
    // Optimistic render: show immediately; the broadcast echo (matched by
    // cid) swaps in the authoritative copy so exactly one renders.
    const kind = view.name.startsWith("#dm-") ? "dm" : "msg";
    track({ts: Date.now()/1000, author, text, cid}, kind);
    if (ws && ws.readyState === 1) {
      ws.send(JSON.stringify({type: "post", author, text, cid}));
    } else {
      try {
        await api(`/api/channels/${encodeURIComponent(view.name)}/messages`,
          {method: "POST", headers: {"Content-Type": "application/json"},
           body: JSON.stringify({author, text, cid})});
      } catch (e) { dropOptimistic(cid); throw e; }
    }
  }
}

let modelCache = null;
async function loadModelPicker(agent) {
  const sel = $("#model-picker");
  try {
    if (!modelCache) modelCache = (await api("/api/models")).models || [];
    const {agents} = await api("/api/agents");
    const me = (agents || []).find(a => a.name === agent);
    const current = (me && me.model) || "";
    sel.innerHTML = `<option value="">default</option>` + modelCache.map(m =>
      `<option value="${esc(m)}"${m === current ? " selected" : ""}>${esc(m.replace(/^[^:]+:/, ""))}</option>`).join("");
    // Current model may not be in the catalog (custom) — still show it.
    if (current && !modelCache.includes(current)) {
      const o = document.createElement("option");
      o.value = current; o.textContent = current.replace(/^[^:]+:/, ""); o.selected = true;
      sel.appendChild(o);
    }
    sel.style.display = "";
    sel.onchange = async () => {
      const model = sel.value || null;
      await api(`/api/agents/${encodeURIComponent(agent)}`,
        {method: "PATCH", headers: {"Content-Type": "application/json"},
         body: JSON.stringify({model})});
      loadAgents(); // refresh the model label in the sidebar
    };
  } catch { sel.style.display = "none"; }
}

async function loadChanSubs(channel) {
  const panel = $("#chan-subs");
  panel.style.display = "";
  panel.innerHTML = '<span class="subs-label">listening:</span>';
  let agents = [];
  try { agents = (await api("/api/agents")).agents || []; } catch { return; }
  for (const a of agents) {
    const name = a.name;
    if (name === "seed") continue;  // seed listens everywhere
    let subs = {};
    try { subs = (await api(`/api/agents/${encodeURIComponent(name)}/subscriptions`)).channels || {}; } catch {}
    const on = channel in subs;
    const pill = document.createElement("span");
    pill.className = "sub-toggle " + (on ? "on" : "off");
    pill.textContent = (on ? "● " : "○ ") + name;
    pill.title = on ? `${name} is listening — click to unsubscribe` : `${name} is not listening — click to subscribe`;
    pill.onclick = async () => {
      try {
        await api(`/api/agents/${encodeURIComponent(name)}/subscriptions`, {
          method: "POST", headers: {"Content-Type": "application/json"},
          body: JSON.stringify({channel, subscribed: !on})});
        loadChanSubs(channel);
      } catch (e) { alert("Toggle failed: " + e.message); }
    };
    panel.appendChild(pill);
  }
}

async function loadSubs(agent) {
  const panel = $("#subs-panel"), list = $("#subs-list");
  try {
    const [{channels}, subData] = await Promise.all([
      api("/api/channels"),
      api(`/api/agents/${encodeURIComponent(agent)}/subscriptions`),
    ]);
    const subs = (subData && subData.channels) || {};
    // Only real channels (no thought streams / DMs).
    const chans = (channels || []).filter(c => !c.startsWith("#thoughts-") && !c.startsWith("#dm-"));
    list.innerHTML = "";
    for (const c of chans) {
      const on = !!subs[c];
      const b = document.createElement("button");
      b.className = "sub-toggle " + (on ? "on" : "off");
      b.textContent = (on ? "✓ " : "+ ") + c;
      b.title = on ? `Unsubscribe ${agent} from ${c}` : `Subscribe ${agent} to ${c}`;
      b.onclick = async () => {
        await api(`/api/agents/${encodeURIComponent(agent)}/subscriptions`,
          {method: "POST", headers: {"Content-Type": "application/json"},
           body: JSON.stringify({channel: c, subscribed: !on})});
        loadSubs(agent);
      };
      list.appendChild(b);
    }
    panel.style.display = chans.length ? "" : "none";
  } catch { panel.style.display = "none"; }
}

const fmtTok = n => n >= 1e6 ? (n/1e6).toFixed(1) + "M" : n >= 1e3 ? (n/1e3).toFixed(1) + "k" : String(n);
const fmtUsd = n => "$" + n.toFixed(2);
const fmtEta = h => h == null ? "—" : h <= 0 ? "empty" : h < 1 ? Math.round(h*60) + "m" : h < 48 ? h.toFixed(1) + "h" : Math.round(h/24) + "d";

async function loadUsage() {
  try {
    const u = await api("/api/usage");
    const s = u.summary, eta = u.eta;
    let txt = `\u{1F525} ${fmtTok(s.total_tokens)} tok / ${fmtUsd(s.cost_usd)}`;
    if (s.cache_hit_rate != null) txt += ` · ${Math.round(s.cache_hit_rate * 100)}% cached`;
    let cls = "";
    if (eta.eta_hours != null) {
      txt += ` · ~${fmtEta(eta.eta_hours)} left`;
      if (eta.eta_hours < 2) cls = "crit";
      else if (eta.eta_hours < 8) cls = "warn";
    } else if (eta.credit_balance_usd == null) {
      txt += " · set credit balance";
    }
    const w = $("#usage-summary");
    w.innerHTML = `<span class="${cls}">${esc(txt)}</span>`;
    w.dataset.full = JSON.stringify(u);
  } catch { $("#usage-summary").textContent = "usage n/a"; }
}

function toggleUsagePanel() {
  const p = $("#usage-panel");
  if (p.style.display !== "none") { p.style.display = "none"; return; }
  let u = {};
  try { u = JSON.parse($("#usage-summary").dataset.full || "{}"); } catch {}
  const s = u.summary || {}, eta = u.eta || {}, byAgent = s.by_agent || {};
  const burn1 = (u.burn_1h || {}).cost_per_hour, burn24 = (u.burn_24h || {}).cost_per_hour;
  let html = `<h4>Usage</h4>
    <div class="urow"><span>total tokens</span><span>${fmtTok(s.total_tokens || 0)}</span></div>
    <div class="urow"><span>in / out</span><span>${fmtTok(s.input_tokens || 0)} / ${fmtTok(s.output_tokens || 0)}</span></div>
    <div class="urow"><span>cost</span><span>${fmtUsd(s.cost_usd || 0)}${s.cost_estimated ? " (est)" : ""}</span></div>
    <div class="urow"><span>burn 1h / 24h</span><span>${fmtUsd(burn1 || 0)}/h · ${fmtUsd(burn24 || 0)}/h</span></div>
    <h4 style="margin-top:10px">Prompt cache</h4>
    <div class="urow"><span>hit rate</span><span>${s.cache_hit_rate != null ? Math.round(s.cache_hit_rate * 100) + "%" : "—"}</span></div>
    <div class="urow"><span>read / write</span><span>${fmtTok(s.cache_read_tokens || 0)} / ${fmtTok(s.cache_write_tokens || 0)}</span></div>
    <div class="urow"><span>est. saved</span><span>${fmtUsd(s.cache_savings_usd || 0)}${s.cache_savings_estimated ? " (est)" : ""}</span></div>`;
  const agents = Object.entries(byAgent).sort((a,b) => b[1].cost_usd - a[1].cost_usd);
  if (agents.length) {
    html += `<h4 style="margin-top:10px">By agent</h4>`;
    const max = Math.max(...agents.map(([,a]) => a.cost_usd), 0.0001);
    for (const [name, a] of agents) {
      const pct = Math.round(100 * a.cost_usd / max);
      html += `<div class="urow"><span>${esc(name)}</span><span>${fmtTok(a.input_tokens + a.output_tokens)} · ${fmtUsd(a.cost_usd)}</span></div>
      <div class="bar"><div style="width:${pct}%"></div></div>`;
    }
  }
  const bal = eta.credit_balance_usd;
  html += `<h4 style="margin-top:10px">Credits</h4>
    <div class="urow"><span>balance</span><span>${bal != null ? fmtUsd(bal) : "not set"}</span></div>
    <div class="urow"><span>remaining</span><span>${eta.remaining_usd != null ? fmtUsd(eta.remaining_usd) : "—"}</span></div>
    <div class="urow"><span>runway</span><span>${eta.eta_hours != null ? "~" + fmtEta(eta.eta_hours) + " at current burn" : "set balance for ETA"}</span></div>
    <div class="urow"><span>set balance $</span><span><input id="bal-input" type="number" min="0" step="0.01" placeholder="${bal != null ? bal : "0.00"}"> <button id="bal-save">save</button></span></div>`;
  p.innerHTML = html;
  p.style.display = "";
  $("#bal-save").onclick = async () => {
    const v = parseFloat($("#bal-input").value);
    if (isNaN(v) || v < 0) return;
    await api("/api/usage/balance", {method: "PUT", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({balance_usd: v})});
    loadUsage(); toggleUsagePanel(); toggleUsagePanel();
  };
}

$("#usage-widget").onclick = toggleUsagePanel;
$("#sidebar-toggle").onclick = () => setSidebar(!document.body.classList.contains("sidebar-open"));
$("#sidebar-scrim").onclick = () => setSidebar(false);
document.addEventListener("keydown", e => { if (e.key === "Escape") setSidebar(false); });

$("#send").onclick = send;
$("#input").addEventListener("keydown", e => { if (e.key === "Enter") send(); });
$("#add-chan").onclick = async () => {
  const name = prompt("Channel name:");
  if (!name) return;
  await api("/api/channels", {method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({name})});
  await loadChannels(); switchChannel("#" + name.replace(/^#+/, ""));
};

(async () => { await loadChannels(); await loadAgents(); await loadUsage(); switchChannel("#general"); setInterval(loadAgents, 15000); setInterval(loadUsage, 60000); })();
</script>
</body>
</html>
